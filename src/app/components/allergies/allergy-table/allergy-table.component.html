<div class="w-full overflow-x-auto md:overflow-visible">
  <table mat-table [dataSource]="data" class="min-w-175">
    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.name }}
      </td>
    </ng-container>

    <!-- Details -->
    <ng-container matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef>Details</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.details }}
      </td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">
        <span
          class="px-2 py-1 rounded-full text-xs font-medium"
          [ngClass]="{
            'bg-green-100 text-green-700': element.status === 'active',
            'bg-red-100 text-red-700': element.status === 'inactive',
            'bg-gray-100 text-gray-600': !element.status,
          }"
        >
          {{ element.status ? element.status[0].toUpperCase() + element.status.slice(1) : 'N/A' }}
        </span>
      </td>
    </ng-container>

    <!-- Display On Card -->
    <ng-container matColumnDef="displayOnCard">
      <th mat-header-cell *matHeaderCellDef>Displayed on Card?</th>
      <td mat-cell *matCellDef="let element">
        <span
          class="px-2 py-1 rounded-full text-xs font-medium"
          [ngClass]="
            element.displayOnCard ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'
          "
        >
          {{ element.displayOnCard ? 'Yes' : 'No' }}
        </span>
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>

      <td mat-cell *matCellDef="let element">
        <button mat-icon-button class="text-blue-500!" (click)="edit(element)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button class="text-red-500!" (click)="delete(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Header + rows -->
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>

    <!-- No data -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="cols.length">No data found</td>
    </tr>
  </table>
</div>
