<div class="w-full max-h-[375px] overflow-y-auto overflow-x-auto">
  <table mat-table [dataSource]="data" class="min-w-175 w-full">
    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.name }}
      </td>
    </ng-container>

    <!-- Npi Number -->
    <ng-container matColumnDef="npiNumber">
      <th mat-header-cell *matHeaderCellDef>Npi Number</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.npiNumber }}
      </td>
    </ng-container>

    <!-- Speciality -->
    <ng-container matColumnDef="speciality">
      <th mat-header-cell *matHeaderCellDef>Speciality</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.speciality }}
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>

      <td mat-cell *matCellDef="let element">
        <button mat-icon-button class="text-blue-500!" (click)="edit(element)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button class="text-red-500!" (click)="delete(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Header + rows -->
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>

    <!-- No data -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="cols.length">No data found</td>
    </tr>
  </table>
</div>
