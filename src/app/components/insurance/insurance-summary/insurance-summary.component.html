<div class="bg-gray-50 shadow-sm border border-gray-100 rounded-lg p-5">
  <!-- Header -->
  <div class="flex items-center gap-3 mb-4">
    <div class="w-10 h-10 rounded-lg bg-primary/15 flex items-center justify-center">
      <mat-icon class="text-primary">health_and_safety</mat-icon>
    </div>

    <div>
      <h3 class="text-sm font-semibold text-gray-900">Insurance Summary</h3>

      <p class="text-xs text-gray-500">Patient insurance overview</p>
    </div>
  </div>

  <!-- Summary Items -->
  <div class="space-y-3">
    <div *ngFor="let item of items" class="flex items-center justify-between text-sm gap-4">
      <span class="text-gray-500 shrink-0">
        {{ item.label }}
      </span>

      <span class="font-medium text-gray-900 text-right">
        {{ item.value || '-' }}
      </span>
    </div>
  </div>
</div>
