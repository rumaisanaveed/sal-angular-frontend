<div class="w-full overflow-x-auto md:overflow-visible">
  <table mat-table [dataSource]="data" class="min-w-175">
    <!-- Name -->
    <ng-container matColumnDef="procedureName">
      <th mat-header-cell *matHeaderCellDef>Name</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.procedureName }}
      </td>
    </ng-container>

    <!-- Type -->
    <ng-container matColumnDef="procedureType">
      <th mat-header-cell *matHeaderCellDef>Type</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.procedureType }}
      </td>
    </ng-container>

    <!-- Code -->
    <ng-container matColumnDef="medicalCode">
      <th mat-header-cell *matHeaderCellDef>Code</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.medicalCode }}
      </td>
    </ng-container>

    <!-- Date -->
    <ng-container matColumnDef="procedureDate">
      <th mat-header-cell *matHeaderCellDef>Date</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.procedureDate }}
      </td>
    </ng-container>

    <!-- Details -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>

      <td mat-cell *matCellDef="let element" class="font-normal text-sm text-gray-700">
        {{ element.description }}
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>

      <td mat-cell *matCellDef="let element">
        <button mat-icon-button class="text-blue-500!" (click)="edit(element)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button class="text-red-500!" (click)="delete(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Header + rows -->
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>

    <!-- No data -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="cols.length">No data found</td>
    </tr>
  </table>
</div>
