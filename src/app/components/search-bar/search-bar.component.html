<div class="relative w-64" [ngClass]="class">
  <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"> search </mat-icon>

  <input
    matInput
    [(ngModel)]="searchTerm"
    (input)="onSearch($event.target.value)"
    placeholder="Search..."
    class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg w-full focus:ring-2 focus:ring-primary focus:border-primary outline-none"
  />
</div>
