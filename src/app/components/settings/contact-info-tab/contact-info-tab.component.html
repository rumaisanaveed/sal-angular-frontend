<div class="p-6">
  <!-- CONTACT CARD -->
  <div class="border border-gray-100 rounded-xl p-6 bg-white shadow-sm">
    <div class="mb-6">
      <h2 class="text-lg font-semibold text-gray-900">Contact Information</h2>

      <p class="text-sm text-gray-500 mt-1">Update your phone numbers and address</p>
    </div>

    <form class="space-y-8" [formGroup]="contactInfoForm">
      <!-- PHONE -->
      <div>
        <h3 class="text-sm font-semibold text-primary mb-4">Phone Numbers</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <mat-form-field appearance="outline">
            <mat-label>Primary Phone</mat-label>

            <input matInput formControlName="primaryPhoneNumber" placeholder="+1 (555) 000-0000" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Mobile Phone</mat-label>

            <input matInput formControlName="mobilePhone" placeholder="+1 (555) 000-0000" />
          </mat-form-field>
        </div>
      </div>

      <!-- ADDRESS -->
      <div>
        <h3 class="text-sm font-semibold text-primary mb-4">Address</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <mat-form-field appearance="outline" class="md:col-span-2">
            <mat-label>Address Line 1</mat-label>

            <input matInput formControlName="addressLine1" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>City</mat-label>

            <input matInput formControlName="city" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Postal Code</mat-label>

            <input matInput formControlName="postalCode" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>State</mat-label>

            <input matInput formControlName="state" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Country</mat-label>

            <input matInput formControlName="country" />
          </mat-form-field>
        </div>
      </div>

      <!-- PREFERENCES -->
      <div>
        <h3 class="text-sm font-semibold text-primary mb-4">Preferences</h3>

        <div class="flex flex-col gap-4">
          <mat-slide-toggle color="primary" formControlName="receiveEmailAlerts">
            Receive Email Alerts
          </mat-slide-toggle>

          <mat-slide-toggle color="primary" formControlName="receiveTextMessages">
            Receive Text Messages
          </mat-slide-toggle>

          <mat-slide-toggle color="primary" formControlName="subscribeToNewsletter">
            Subscribe to Newsletter
          </mat-slide-toggle>
        </div>
      </div>

      <app-footer-buttons
        [isDisabled]="saving()"
        (onSave)="updateContactInfo()"
        (onCancel)="cancelFormSubmission()"
      />
    </form>
  </div>
</div>
