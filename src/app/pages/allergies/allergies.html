<div class="p-2 min-h-screen">
  <div class="bg-white shadow-sm p-6 mb-6 border border-gray-200" style="border-radius: 15px">
    <h2 class="text-primary font-semibold text-xl md:text-2xl mb-4">Add New Allergy</h2>

    <app-allergy-form [allergyForm]="allergyForm" (submit)="addAllergy()">
      <button mat-flat-button color="primary" class="w-fit" [disabled]="allergyForm.disabled">
        Save
      </button>
    </app-allergy-form>
  </div>

  <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200" style="border-radius: 15px">
    <div class="flex flex-col md:flex-row gap-3 md:items-center md:justify-between mb-4">
      <h2 class="text-primary font-semibold text-xl md:text-2xl">Allergies</h2>
      <app-search-bar (search)="applyFilter($event)"></app-search-bar>
    </div>

    <!-- Allergies Table -->
    <app-allergy-table
      [data]="dataSource"
      [cols]="columns"
      (onEdit)="openEditModal($event)"
      (onDelete)="openDeleteConfirmationModal($event)"
    />
  </div>

  <!-- Edit Allergy Modal -->
  <ng-template #editModal>
    <app-allergy-form [allergyForm]="editAllergyForm" />
  </ng-template>

  <!-- Delete Allergy Modal -->
  <ng-template #deleteModal> </ng-template>
</div>
