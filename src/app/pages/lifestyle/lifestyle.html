<div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
  <!-- LEFT: DISPLAY CARDS -->
  <div class="lg:col-span-3 space-y-6">
    <app-lifestyle-info
      class="space-y-6"
      [data]="lifestyleData"
      (onEditSection)="editSection($event)"
    />
  </div>

  <!-- RIGHT: EDIT FORM -->

  <div class="lg:col-span-2">
    <div class="bg-white rounded-xl shadow-sm p-6 space-y-4">
      <h2 class="text-lg font-semibold">Edit Lifestyle</h2>
      <p class="text-sm text-gray-500">Select a section to edit</p>

      <app-lifestyle-form
        [activeSection]="activeSection"
        [form]="lifestyleForm"
        (onSave)="save()"
      />

      <!-- EMPTY STATE -->
      <div *ngIf="!activeSection" class="text-sm text-gray-400">
        Select a section from the right to edit
      </div>
    </div>
  </div>
</div>
