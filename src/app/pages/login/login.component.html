<div class="h-screen flex items-center justify-center w-full">
  <div class="bg-white rounded-xl shadow p-10 w-11/12 sm:w-full sm:max-w-md flex flex-col gap-6">
    <h1 class="text-primary font-bold text-2xl text-center">Login</h1>
    <form class="flex flex-col gap-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="email" class="input-field" />
      </div>
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        <small *ngIf="loginForm.get('email')?.errors?.['required']" class="error-text">
          Email is required.
        </small>
        <small *ngIf="loginForm.get('email')?.errors?.['email']" class="error-text">
          Please enter valid email address.
        </small>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" formControlName="password" type="password" class="input-field" />
      </div>
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        <small *ngIf="loginForm.get('password')?.errors?.['required']" class="error-text">
          Password is required.
        </small>
      </div>
      <button mat-flat-button class="w-full rounded-lg!">Login</button>
    </form>
    <p class="text-gray-500">
      Don't have an account?
      <a href="/signup" class="text-primary"> Signup </a>
    </p>
  </div>
</div>
